server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/manifest+json;
    gzip_min_length 256;

    # Security headers (server-level; re-declare in locations that use add_header)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(css|js|ico|svg|png|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # Nginx clears parent add_header in this block — re-apply required headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
